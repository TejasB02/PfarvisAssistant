# Streamlit settings - local only, no usage statistics.

[browser]
gatherUsageStats = false

[server]
address = "127.0.0.1"
port = 8501
headless = true

[theme]
base = "light"
primaryColor = "#3B5BDB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F9"
textColor = "#1F2933"
font = "sans serif"
